# ── AdGuard Home · DNS de la oficina con bloqueo de anuncios (Raspberry Pi) ────
# Asistente inicial: http://IP-PI:3053 → elige el puerto 3000 para la interfaz de administración.
# Después, en el router, pon la IP de la Pi como DNS para toda la red.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3053:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
