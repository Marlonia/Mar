# Servicios del panel. La descripción dice qué suscripción reemplaza cada uno (precios de referencia, USD/mes).
# siteMonitor: muestra el estado del servicio · server/container: CPU y RAM del contenedor (solo los que corren en este nodo).
- Automatización y clientes:
    - n8n:
        icon: n8n.png
        href: https://n8n.{{HOMEPAGE_VAR_DOMINIO}}
        description: Automatizaciones · reemplaza a Zapier ($29.99)
        siteMonitor: https://n8n.{{HOMEPAGE_VAR_DOMINIO}}
        server: nodo1
        container: n8n
    - Twenty CRM:
        icon: mdi-account-group
        href: https://crm.{{HOMEPAGE_VAR_DOMINIO}}
        description: Clientes y pipeline de ventas · reemplaza a HubSpot ($20)
        siteMonitor: https://crm.{{HOMEPAGE_VAR_DOMINIO}}
        server: nodo1
        container: twenty
    - Chatwoot:
        icon: chatwoot.png
        href: https://chat.{{HOMEPAGE_VAR_DOMINIO}}
        description: Chat web, WhatsApp e Instagram en una bandeja · reemplaza a Intercom ($39)
        siteMonitor: https://chat.{{HOMEPAGE_VAR_DOMINIO}}

