# ── Agente de nodo ─────────────────────────────────────────────────────────────
# Corre en TODOS los nodos (mini PCs y Raspberry Pi):
#   · cloudflared  → conecta el nodo a Cloudflare Tunnel (sin abrir puertos en el router)
#   · beszel-agent → envía CPU, RAM, disco, temperatura y contenedores al panel Beszel
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]          # solo arranca si COMPOSE_PROFILES=tunnel en .env
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [agencia]

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "45876"
      KEY: ${BESZEL_AGENT_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  agencia:
    external: true
